<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
  <defs>
    <linearGradient id="ms-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38281d"/>
      <stop offset="50%" stop-color="#221a15"/>
      <stop offset="100%" stop-color="#181e24"/>
    </linearGradient>
    <linearGradient id="ms-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae9c4"/>
      <stop offset="40%" stop-color="#e8c98e"/>
      <stop offset="75%" stop-color="#cf9e58"/>
      <stop offset="100%" stop-color="#a87d3a"/>
    </linearGradient>
  </defs>
  <!-- Badge Base -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#ms-badge-bg)" stroke="url(#ms-gold)" stroke-width="1.2"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <!-- Outer Lens Rings -->
  <circle cx="24" cy="24" r="16.5" fill="none" stroke="url(#ms-gold)" stroke-width="0.6" stroke-dasharray="1.5 2.5" opacity="0.65"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="url(#ms-gold)" stroke-width="0.7" opacity="0.45"/>
  <!-- Aperture Blades -->
  <line x1="35.69" y1="17.25" x2="28.03" y2="27.29" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="35.69" y1="30.75" x2="23.17" y2="29.13" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="24.00" y1="37.50" x2="19.14" y2="25.84" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="12.31" y1="30.75" x2="19.97" y2="20.71" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="12.31" y1="17.25" x2="24.83" y2="18.87" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <line x1="24.00" y1="10.50" x2="28.86" y2="22.16" stroke="url(#ms-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.9"/>
  <!-- Central Diamond Gem Facet -->
  <polygon points="24,19 28.2,24 24,29 19.8,24" fill="none" stroke="url(#ms-gold)" stroke-width="1.1"/>
  <polygon points="24,20.8 26.6,24 24,27.2 21.4,24" fill="url(#ms-badge-bg)" stroke="url(#ms-gold)" stroke-width="0.7" opacity="0.85"/>
  <!-- Luminous Lens Core -->
  <circle cx="24" cy="24" r="2.2" fill="url(#ms-gold)"/>
  <circle cx="24" cy="24" r="0.85" fill="#ffffff"/>
</svg>